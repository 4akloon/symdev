# The Rust SDK for Symbian OS 9.3 (S60 3rd FP2, Nokia E52). A workspace separate from the
# host tools in `crates/`: these crates build for `targets/arm-symbian-e32.json` with
# `-Zbuild-std` on the nightly pinned in `rust-toolchain.toml`.
[workspace]
resolver = "3"
# `examples/std-hello` and `examples/std-net` are deliberately **not** members: they are
# the examples built against a real `std` (design spec §11 step 77), and cargo unifies
# features across a workspace, so `symbian-std` would be asked for its `runtime` and its
# `std` halves at once — two `__start`s and an `extern crate std` in a build that has no
# `std`. Each is its own workspace, with its own `.cargo/config.toml` naming
# `-Zbuild-std=std`.
members = [
    "crates/symbian-sys",
    "crates/symbian-alloc",
    "crates/symbian-libcalls",
    "crates/symbian-async",
    "crates/symbian-core",
    "crates/symbian-std",
    "crates/symbian-ui",
    "crates/symbian-runtime",
    "crates/symbian-macros",
    "examples/async",
    "examples/hello",
    "examples/hello-raw",
    "examples/alloc",
    "examples/shim",
    "examples/spawnee",
    "examples/files",
    "examples/atomics",
    "examples/time",
    "examples/net",
    "examples/tls",
    "examples/ui",
    "examples/notes",
    "examples/query",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

# rustc never links (design spec §3): every leaf crate is a `staticlib` that symdev's
# recorded `ld` line consumes. Size over speed, one object per archive, no unwinder.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
debug = false

# The SDK's compiler-runtime crate is linked as its own archive, not compiled into the
# application, so that a program which performs no atomic operation and compares no
# bytes carries none of it. `lto = false` is what makes that possible: under the
# workspace's `lto = true` an rlib holds LLVM bitcode, which `ld` cannot read, and
# `staticlib` would need its own `#[panic_handler]` and collide with the application's.
[profile.libcalls]
inherits = "release"
lto = false
# One codegen unit per module, so the archive has one member per concern and a program
# that only compares bytes does not also pull the atomics in. With the workspace's
# `codegen-units = 1` everything shared one object and `examples/files`, which uses
# `memcmp` and no atomic, grew 714 bytes for code it never calls.
codegen-units = 16

[profile.dev]
panic = "abort"
