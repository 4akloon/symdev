[package]
name = "symbian-core"
version.workspace = true
edition.workspace = true
description = "Safe Symbian OS 9.3 domain types: system error codes and the 16-bit descriptor family"

[lib]
crate-type = ["rlib"]

[dependencies]
# `Buf16` is the fast `write!`'s native destination (experiment 99).
symbian-fmt = { path = "../symbian-fmt" }
symbian-sys = { path = "../symbian-sys" }
