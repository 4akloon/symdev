[package]
name = "symbian-macros"
version.workspace = true
edition.workspace = true
description = "The #[main] attribute behind symbian_std::main: the E32Main wrapper a Symbian application needs"

[lib]
proc-macro = true

[dependencies]
# The one reader of locales files, shared with `symdev build`. Dependency-free, so this
# crate still pulls nothing into an application's host build.
symdev-locale = { path = "../../../crates/symdev-locale" }

[dev-dependencies]
tempfile = "3"
