[package]
name = "symbian-std"
version.workspace = true
edition.workspace = true
description = "std's module tree over Symbian OS 9.3: io, fs and a prelude, so porting a program is changing its use lines"

[lib]
crate-type = ["rlib"]

[dependencies]
symbian-alloc = { path = "../symbian-alloc" }
symbian-async = { path = "../symbian-async" }
symbian-core = { path = "../symbian-core" }
symbian-macros = { path = "../symbian-macros" }
symbian-runtime = { path = "../symbian-runtime" }
symbian-sys = { path = "../symbian-sys" }
