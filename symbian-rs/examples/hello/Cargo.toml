[package]
name = "hello"
version.workspace = true
edition.workspace = true
# `src/main.rs` is a library: rustc never links, symdev does (design spec §3).
autobins = false

[lib]
path = "src/main.rs"
crate-type = ["staticlib"]

[dependencies]
symbian-runtime = { path = "../../crates/symbian-runtime" }
