[package]
name = "uidemo"
version = "0.1.0"

[target]
device = "nokia-e52"

[language]
name = "rust"

[symbian]
uid3 = "0xe0000687"
capabilities = []
vendor = "symdev"
icon = "gfx/uidemo.svg"

# Present = this is an Avkon application: the C++ subclasses, the six Avkon import
# libraries, and the application and registration resources a captioned application
# needs. Without it the same crate would build as a console program.
[ui]
kind = "avkon"
caption = "Rust bars"
short_caption = "Bars"

# Each item's `id` is the word the Rust source repeats in `Command::named`; the number
# behind it is derived from that word and appears in neither place. A menu turns the
# left softkey into Options on its own.
[[ui.menu]]
id = "more"
label = "More bars"

[[ui.menu]]
id = "fewer"
label = "Fewer bars"

[[ui.menu]]
id = "reset"
label = "Reset"

[[ui.menu]]
id = "quit"
label = "Exit"

[signing]
mode = "self-signed"
