[package]
name = "uidemo"
version = "0.1.0"

[target]
device = "nokia-e52"

[language]
name = "rust"

[symbian]
uid3 = "0xe0000687"
capabilities = []
vendor = "symdev"
icon = "gfx/uidemo.svg"

# Present = this is an Avkon application: the C++ subclasses, the six Avkon import
# libraries, and the application and registration resources a captioned application
# needs. Without it the same crate would build as a console program.
[ui]
kind = "avkon"
caption = "Rust bars"
short_caption = "Bars"
# The left softkey opens an Options menu. That is all the manifest knows about the
# menu — the lines are declared in `App::menu` and added when it opens — and it has to
# be said here because the button group and the menu bar are compiled resources.
softkeys = "options-exit"

[signing]
mode = "self-signed"
