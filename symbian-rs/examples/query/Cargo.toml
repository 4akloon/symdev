[package]
name = "querydemo"
version.workspace = true
edition.workspace = true
# `src/main.rs` is a library: rustc never links, symdev does (design spec §3).
autobins = false

[lib]
path = "src/main.rs"
crate-type = ["staticlib"]

[dependencies]
symbian-std = { path = "../../crates/symbian-std" }
symbian-core = { path = "../../crates/symbian-core" }
