# The SHA-1 of each toolchain file the overlay replaces, as it was when the overlay
# copy was taken. `StdSrc::materialise` checks every one before it copies, so a
# toolchain bump that touches one of these stops the build and names the file
# instead of quietly undoing whatever upstream changed in it.
#
# Regenerate a line after re-deriving its overlay copy:
#   sha1sum <sysroot>/lib/rustlib/src/rust/library/<path>
#
# Files the overlay adds rather than replaces are not listed.

