# Keeps the Rust dependencies and the CI actions current; nothing here touches
# the SDK toolchain, which stays user-supplied and outside the repo.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Kyiv
    open-pull-requests-limit: 5
    # dsa 0.7 dropped the L=1024/N=224 keys Symbian signs with, and der,
    # x509-cert, pkcs8, sha1 and rand are locked to that same generation.
    # See docs/research/rustcrypto-dsa-0.7-blocked.md; drop this once dsa can
    # decode those keys again.
    ignore:
      - dependency-name: dsa
        update-types: ["version-update:semver-major"]
      - dependency-name: der
        update-types: ["version-update:semver-major"]
      - dependency-name: x509-cert
        update-types: ["version-update:semver-major"]
      - dependency-name: pkcs8
        update-types: ["version-update:semver-major"]
      - dependency-name: sha1
        update-types: ["version-update:semver-major"]
      - dependency-name: rand
        update-types: ["version-update:semver-major"]
    groups:
      # Their minors and patches still have to land together.
      rustcrypto:
        patterns:
          - der
          - dsa
          - pkcs8
          - rand
          - sha1
          - x509-cert
      # One PR for the routine bumps, separate PRs for majors that need a look.
      cargo-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Kyiv
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
