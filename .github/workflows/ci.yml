# Two gates. `check`: format, clippy and tests on a bare runner. The tests are hermetic
# (temporary SYMDEV_HOME and XDG directories, `builtin = false`, file:// sources) and touch
# no network; those that need a real SDK skip themselves (SYMDEV_EPOCROOT,
# SYMDEV_SIGN_PASSWORD). `examples`: builds and packages the examples on a clean runner,
# installing GCCE and the S60 SDK through symdev with the owner's reader key. Running them
# in EKA2L1 stays manual on the host.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # Pinned, not ubuntu-latest: that label migrates to Ubuntu 26 on 2026-10-19.
    runs-on: ubuntu-24.04
    env:
      # Same gate as CLAUDE.md: zero warnings, from rustc and from clippy, in this job.
      # (A RUSTFLAGS no longer touches `symdev build`'s own libcall flag: it is an
      # argument of `cargo rustc`, experiment 111.)
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Pinned to workspace.package.rust-version in Cargo.toml — bump both together.
      - name: Install Rust 1.98.1
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt
          rustup default 1.98.1
          rustc --version

      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-1.98.1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-1.98.1-

      - name: Fetch dependencies
        run: cargo fetch --locked

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --offline --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --offline --locked

  # The examples job needs the reader key of the owner's private bucket, which holds the
  # S60 SDK. Secrets cannot gate a job directly and forks and dependabot get none, so this
  # job looks for the key and the examples job is skipped, not failed, without it.
  examples-key:
    runs-on: ubuntu-24.04
    outputs:
      ok: ${{ steps.key.outputs.ok }}
    steps:
      - id: key
        env:
          KEY: ${{ secrets.SYMDEV_SOURCE_PRIVATE_ACCESS_KEY_ID }}
        run: |
          if [ -n "$KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "No reader key (a fork or dependabot): the examples job is skipped."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

  # Builds and packages the examples on a clean runner the way a new machine does: symdev
  # installs GCCE and the S60 SDK itself (docs/superpowers/specs/2026-10-02-toolchain-manager-design.md §7).
  examples:
    needs: examples-key
    if: needs.examples-key.outputs.ok == 'true'
    runs-on: ubuntu-24.04
    env:
      # The self-signed key is generated per run and thrown away with the runner.
      SYMDEV_SIGN_PASSWORD: ci-throwaway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust 1.98.1 and the Rust SDK's nightly
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' symbian-rs/rust-toolchain.toml)" \
            --profile minimal --component rust-src

      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-release-1.98.1-${{ hashFiles('**/Cargo.lock') }}

      # Only GCCE (GPL, public anyway), keyed on the pins: an unchanged pin downloads no
      # compiler. Never the S60 SDK: pull-request runs, those of forks too (which run the
      # fork's own workflow), can restore this branch's caches, so a cached SDK would be a
      # copy anyone could take. The SDK (about 5 MB) downloads on every run.
      - name: Cache the installed GCCE package
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.local/share/symdev/gcce
          key: symdev-gcce-${{ hashFiles('crates/symdev-sdk/src/pins.rs') }}

      - name: Configure the private source
        env:
          URL: ${{ vars.SYMDEV_PRIVATE_SOURCE_URL }}
        run: |
          mkdir -p ~/.config/symdev
          printf '[[source]]\nname = "private"\nurl = "%s"\nauth = "s3"\n' "$URL" \
            > ~/.config/symdev/sources.toml

      # No reader key here: build scripts of third-party crates run in this step.
      - name: Build symdev
        run: cargo build --release -p symdev-cli --locked

      # The only step that holds the reader key, and it runs only symdev: `symdev sdk
      # install` without ids installs what each example needs (the pinned GCCE and SDK).
      - name: Install the toolchain packages
        env:
          SYMDEV_SOURCE_PRIVATE_ACCESS_KEY_ID: ${{ secrets.SYMDEV_SOURCE_PRIVATE_ACCESS_KEY_ID }}
          SYMDEV_SOURCE_PRIVATE_SECRET_ACCESS_KEY: ${{ secrets.SYMDEV_SOURCE_PRIVATE_SECRET_ACCESS_KEY }}
        run: |
          for dir in examples/hello examples/gui symbian-rs/examples/hello; do
            (cd "$dir" && "$GITHUB_WORKSPACE/target/release/symdev" sdk install)
          done

      # Without the key: everything is installed, so symdev reads no source.
      - name: Build and package the examples
        run: |
          export PATH="$PWD/target/release:$PATH"
          for dir in examples/hello examples/gui symbian-rs/examples/hello; do
            (cd "$dir" && symdev build && symdev package)
          done

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: examples-sisx
          path: |
            examples/*/build/*.sisx
            symbian-rs/examples/hello/build/*.sisx
          if-no-files-found: error
