[workspace]
resolver = "3"
members = [
    "crates/symdev-core",
    "crates/symdev-manifest",
    "crates/symdev-uidcrc",
    "crates/symdev-makekeys",
    "crates/symdev-sis",
    "crates/symdev-rcomp",
    "crates/symdev-mif",
    "crates/symdev-mbm",
    "crates/symdev-elf2e32",
