[package]
name = "puzzles"
version = "1.0.0"

[target]
device = "nokia-e52"

[language]
name = "cpp"

[symbian]
uid3 = "0xA000EF77"
capabilities = []
vendor = "Tiago Dionizio"
icon = "gfx/app.svg"

[signing]
mode = "self-signed"

[[icons]]
dest = "/resource/apps/0xa000ef77/puzzles.mif"
depth = "c32,8"
sources = ["gfx/app.svg"]

# group/Images.mk: mifconv <z>\resource\apps\0xe000ef77\games.mif /H<epoc32>\include\puzzles_0xa000ef77.mbg /c24 ..\gfx\*.bmp (34)
[[icons]]
dest = "/resource/apps/0xa000ef77/games.mif"
header = "puzzles_0xa000ef77.mbg"
depth = "c24"
sources = [
    "gfx/blackbox.bmp",
    "gfx/bridges.bmp",
    "gfx/cube.bmp",
    "gfx/dominosa.bmp",
    "gfx/fifteen.bmp",
