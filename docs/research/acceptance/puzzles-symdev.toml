    "gfx/flip.bmp",
    "gfx/galaxies.bmp",
    "gfx/guess.bmp",
    "gfx/inertia.bmp",
    "gfx/keen.bmp",
    "gfx/lightup.bmp",
    "gfx/loopy.bmp",
    "gfx/magnets.bmp",
    "gfx/map.bmp",
    "gfx/mines.bmp",
    "gfx/net.bmp",
    "gfx/netslide.bmp",
    "gfx/pattern.bmp",
    "gfx/pearl.bmp",
    "gfx/pegs.bmp",
