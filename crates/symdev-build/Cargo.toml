[package]
name = "symdev-build"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
symdev-core = { path = "../symdev-core" }
symdev-sis = { path = "../symdev-sis" }
symdev-makekeys = { path = "../symdev-makekeys" }
symdev-mbm = { path = "../symdev-mbm" }
symdev-mif = { path = "../symdev-mif" }
symdev-rcomp = { path = "../symdev-rcomp" }
symdev-elf2e32 = { path = "../symdev-elf2e32" }
symdev-manifest = { path = "../symdev-manifest" }
symdev-locale = { path = "../symdev-locale" }
# Content hashing for the patched-std overlay (`StdSrc`): it checks that each file it
# replaces is still the toolchain file it was derived from. Not a security use.
sha1 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
der = { version = "0.7", features = ["alloc", "pem"] }
x509-cert = "0.2"
# The SDK's fast `write!` (experiment 99) is phone code, but its expansion is plain
# Rust: the host tests in `tests/fast_write*.rs` run it against `core::write!` call for
# call. The SDK workspace cannot run them itself — it builds for the phone.
symbian-fmt = { path = "../../symbian-rs/crates/symbian-fmt" }
