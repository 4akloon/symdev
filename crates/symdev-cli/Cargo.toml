[package]
name = "symdev-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "symdev"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
pollster = "1.0"
symdev-build = { path = "../symdev-build" }
symdev-core = { path = "../symdev-core" }
symdev-emulator = { path = "../symdev-emulator" }
symdev-manifest = { path = "../symdev-manifest" }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
