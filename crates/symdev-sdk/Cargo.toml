[package]
name = "symdev-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
symdev-core = { path = "../symdev-core" }
symdev-manifest = { path = "../symdev-manifest" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "1"
sha2 = "0.10"
hmac = "0.12"
flate2 = "1"
tar = "0.4"
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Index signatures: verification only needs `std`; `zeroize` wipes a signing key on drop.
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }
base64 = "0.23"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
